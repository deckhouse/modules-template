{{- if eq (include "helm_lib_module_gateway_enabled" .) "true" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echoserver
  namespace: {{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "echoserver")) | nindent 2 }}
spec:
  hostnames:
    - {{ include "helm_lib_module_public_domain" (list . "echoserver") }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: main
      namespace: {{ .Chart.Name }}
      sectionName: echoserver
  rules:
    - backendRefs:
        - name: echoserver
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echoserver-redirect
  namespace: {{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "echoserver")) | nindent 2 }}
spec:
  hostnames:
    - {{ include "helm_lib_module_public_domain" (list . "echoserver") }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: main
      namespace: {{ .Chart.Name }}
      sectionName: echoserver-redirect
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
    matches:
    - path:
        type: PathPrefix
        value: /
{{- end }}
