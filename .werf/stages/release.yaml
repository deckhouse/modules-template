# Release image, stored in your.registry.io/modules/<module-name>/release:<semver>
---
image: release-channel-version
fromImage: builder/scratch
import:
  - image: images-digests-and-version
    add: /
    to: /
    includePaths:
      - version.json
    after: install
git:
  - add: /
    to: /
    includePaths:
      - changelog.yaml
      - crds
      - docs/*.md
      - docs/images/*.png
      - docs/images/*.jpeg
      - docs/images/*.jpg
      - docs/images/*.svg
      - module.yaml
      - openapi
