# Release image, stored in your.registry.io/modules/<module-name>/release:<semver>
---
image: release-channel-version
fromImage: builder/scratch
import:
  - image: images-digests-and-version
    add: /
    to: /
    includePaths:
      - version.json
      - images_digests.json
    after: install
git:
  - add: /
    to: /
    includePaths:
      - module.yaml
      - docs/*.md
      - crds
      - openapi
